<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISDO Live — Referee Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0c1117;color:#fff;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:18px}
h1{margin:0 0 14px;font-size:22px}
.card{background:#151c24;border:1px solid #26303d;border-radius:16px;padding:16px;margin-bottom:14px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{text-align:center}
input,select{width:100%;background:#0e141b;color:#fff;border:1px solid #344252;border-radius:10px;padding:12px;font-size:16px}
select{appearance:auto;font-weight:800}
.team-label{font-size:11px;font-weight:900;letter-spacing:.10em;text-transform:uppercase;opacity:.68;margin-bottom:7px}
.score{font-size:62px;font-weight:900;line-height:1;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row-single{justify-content:center}
.row-secondary{margin-top:10px}
button{appearance:none;border:0;border-radius:11px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}
.primary-btn{padding:17px 28px;font-size:18px;min-width:240px}
.accent{background:#71e6c1;color:#102019}
.ghost{background:#26303d;color:#fff}
.danger{background:#ff6b6b;color:#171717}
.warning{background:#ffd166;color:#231b00}
.special{background:#58b7ff;color:#071725}
.golden{background:#f1cb58;color:#241b00}
.timer-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.timer{text-align:center}
.label{opacity:.7;font-size:12px;text-transform:uppercase;letter-spacing:.09em}
.time{font-size:50px;font-weight:900;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.half{text-align:center;font-size:23px;font-weight:900;margin-bottom:10px}
.mode{text-align:center;margin:8px 0 14px;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.status{text-align:center;margin-top:10px;opacity:.72;font-size:13px}
.clock-edit{margin-top:10px;padding-top:10px;border-top:1px solid #2b3745}
.clock-edit-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.clock-input-group{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.clock-edit input{
  width:58px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  padding:10px 6px;
}
.clock-colon{
  display:inline-block;
  font-size:24px;
  line-height:1;
  font-weight:900;
  color:#fff;
  user-select:none;
  pointer-events:none;
}
.clock-edit button{padding:10px 14px;font-size:14px}
.edit-btn{margin-top:8px;background:#39485a;color:#fff}
.apply-btn{background:#71e6c1;color:#102019}
.cancel-btn{background:#26303d;color:#fff}
.hidden{display:none!important}
@media(max-width:650px){
  .teams,.timer-grid{grid-template-columns:1fr}
  .score{font-size:54px}
  .time{font-size:44px}
  button{flex:1;min-width:120px}
  .primary-btn{min-width:0;font-size:19px}
}

.court-display{
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 0 12px;
}

.court-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:120px;
  height:36px;
  padding:0 18px;
  background:#172330;
  color:#fff;
  border-top:4px solid #c91f39;
  border-radius:6px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.10em;
  text-transform:uppercase;
  box-shadow:0 2px 8px rgba(0,0,0,.14);
}


.back-row{
  display:flex;
  justify-content:center;
  margin-top:8px;
}
.back-btn{
  background:#26303d;
  color:#dfe6ec;
  border:1px solid #3a4857;
  padding:8px 12px;
  font-size:12px;
  border-radius:8px;
  min-width:0;
}


/* Prevent iOS/Safari double-tap zoom on referee controls without changing layout */
button,
.score-btn,
.back-btn,
.edit-btn,
.apply-btn{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

</style>
</head>
<body>
<div class="wrap">
<h1>ISDO Live — Referee Control</h1>

<div class="card">
  <div class="court-display"><div class="court-badge" id="courtBadge">COURT 1</div></div>

<div class="team-label">Category</div>
  <select id="category" aria-label="Category">
    <option value="MEN">MEN</option>
    <option value="WOMEN">WOMEN</option>
    <option value="MIXED">MIXED</option>
  </select>
</div>

<div class="card teams">
  <div class="team">
    <div class="team-label">Team A</div>
    <select id="teamA" aria-label="Select Team A">
      <option value="">Loading teams…</option>
    </select>
    <div class="score" id="scoreA">0</div>
    <div class="row">
      <button class="ghost" onclick="changeScore('a',-1)">−</button>
      <button class="accent" onclick="changeScore('a',1)">+</button>
    </div>
  </div>

  <div class="team">
    <div class="team-label">Team B</div>
    <select id="teamB" aria-label="Select Team B">
      <option value="">Loading teams…</option>
    </select>
    <div class="score" id="scoreB">0</div>
    <div class="row">
      <button class="ghost" onclick="changeScore('b',-1)">−</button>
      <button class="accent" onclick="changeScore('b',1)">+</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="half" id="halfText">FIRST HALF</div>
  <div class="mode" id="modeText">NORMAL PLAY</div>

  <div class="row row-single" id="gamePrimaryRow">
    <button class="accent primary-btn" id="gameBtn" onclick="toggleGame()">START GAME</button>
  </div>

  <div class="row row-secondary" id="secondaryPlayRow">
    <button class="special" id="special90Btn" onclick="activateSpecial90()">1:30 SET</button>
    <button class="warning" id="halfTimeBtn" onclick="startHalfTime()">HALF TIME</button>
    <button class="golden hidden" id="goldenBtn" onclick="activateGoldenSet()">GOLDEN SET 3:00</button>
  </div>

  <div class="back-row hidden" id="backToMatchRow">
    <button class="back-btn" onclick="backToMatch()">← BACK TO MATCH</button>
  </div>

  <div class="row hidden" id="halfControls" style="margin-top:10px">
    <button class="accent" id="halfToggleBtn" onclick="toggleHalfTimeClock()">PAUSE HALF TIME</button>
    <button class="ghost" onclick="resetHalfTime()">RESET 3:00</button>
    <button class="warning" onclick="prepareSecondHalf()">PREPARE SECOND HALF</button>
  </div>
</div>

<div class="card timer-grid">
  <div class="timer" id="gameClockCard">
    <div class="label">Match Clock</div>
    <div class="time" id="gameTime">15:00</div>
    <div class="row">
      <button class="ghost" onclick="resetGame()">RESET 15:00</button>
      <button class="edit-btn" id="editGameBtn" onclick="openClockEdit('game')">EDIT</button>
    </div>
    <div class="clock-edit hidden" id="gameEditPanel">
      <div class="clock-edit-row">
        <div class="clock-input-group" aria-label="Match clock time">
          <input id="gameEditMin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="MM" aria-label="Minutes">
          <span class="clock-colon">:</span>
          <input id="gameEditSec" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="SS" aria-label="Seconds">
        </div>
        <button class="apply-btn" onclick="applyClockEdit('game')">APPLY</button>
        <button class="cancel-btn" onclick="closeClockEdit('game')">CANCEL</button>
      </div>
    </div>
  </div>

  <div class="timer" id="setClockCard">
    <div class="label" id="setLabel">Set Clock</div>
    <div class="time" id="setTime">03:00</div>
    <div class="row">
      <button class="accent" id="setBtn" onclick="toggleSet()">START SET</button>
      <button class="ghost" id="setResetBtn" onclick="resetSet()">RESET 3:00</button>
      <button class="edit-btn" id="editSetBtn" onclick="openClockEdit('set')">EDIT</button>
    </div>
    <div class="clock-edit hidden" id="setEditPanel">
      <div class="clock-edit-row">
        <div class="clock-input-group" aria-label="Set clock time">
          <input id="setEditMin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="MM" aria-label="Minutes">
          <span class="clock-colon">:</span>
          <input id="setEditSec" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="SS" aria-label="Seconds">
        </div>
        <button class="apply-btn" onclick="applyClockEdit('set')">APPLY</button>
        <button class="cancel-btn" onclick="closeClockEdit('set')">CANCEL</button>
      </div>
    </div>
  </div>
</div>

<div class="card hidden" id="halfClockCard">
  <div class="timer">
    <div class="label">Half Time</div>
    <div class="time" id="halfTime">03:00</div>
  </div>
</div>

<div class="card">
  <div class="row">
    <button class="danger" onclick="resetAll()">NEW MATCH / RESET</button>
  </div>
  <div class="status" id="status">Connecting…</div>
</div>
</div>

<script>
const SUPABASE_URL="https://orqvmsttedmtenvrwfzk.supabase.co";
const SUPABASE_KEY="sb_publishable_Nfs8j9E7aiQea5VHC_hD-Q_tHm7nWv3";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(window.location.search);
const COURT=Math.min(4,Math.max(1,Number(params.get('court'))||1));
document.title=`ISDO Live — Referee Control — Court ${COURT}`;
document.addEventListener('DOMContentLoaded',()=>{
  const badge=document.getElementById('courtBadge');
  if(badge) badge.textContent=`COURT ${COURT}`;
});

let match=null,matchId=null,ticking=false;
let teams=[];

function fmt(sec){
  sec=Math.max(0,Number(sec||0));
  const m=Math.floor(sec/60),s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function remainingSeconds(storedSeconds,running,endsAt){
  if(!running) return Math.max(0,Number(storedSeconds||0));
  if(!endsAt) return Math.max(0,Number(storedSeconds||0));
  return Math.max(0,Math.ceil((new Date(endsAt).getTime()-Date.now())/1000));
}

function isoAfter(seconds){
  return new Date(Date.now()+Math.max(0,Number(seconds||0))*1000).toISOString();
}

function gameRemaining(){
  return remainingSeconds(match?.game_seconds,match?.game_running,match?.game_ends_at);
}
function setRemaining(){
  return remainingSeconds(match?.set_seconds,match?.set_running,match?.set_ends_at);
}
function halftimeRemaining(){
  return remainingSeconds(match?.halftime_seconds,match?.halftime_running,match?.halftime_ends_at);
}
function mode(){ return match?.play_mode||'normal'; }
function setStatus(t){ document.getElementById('status').textContent=t; }

function onlyDigits(value,maxLen){
  return String(value||'').replace(/\D/g,'').slice(0,maxLen);
}

function setSplitClockInputs(type,totalSeconds){
  const total=Math.max(0,Number(totalSeconds||0));
  const minutes=Math.floor(total/60);
  const seconds=total%60;
  document.getElementById(type+'EditMin').value=String(minutes).padStart(2,'0');
  document.getElementById(type+'EditSec').value=String(seconds).padStart(2,'0');
}

function readSplitClockInputs(type){
  const minEl=document.getElementById(type+'EditMin');
  const secEl=document.getElementById(type+'EditSec');

  const minRaw=onlyDigits(minEl.value,3);
  const secRaw=onlyDigits(secEl.value,2);

  // Empty fields are treated as 0. The colon is a permanent visual separator.
  const minutes=minRaw===''?0:Number(minRaw);
  const seconds=secRaw===''?0:Number(secRaw);

  if(!Number.isFinite(minutes) || !Number.isFinite(seconds) || seconds>59) return null;
  return minutes*60+seconds;
}

function bindClockNumberInputs(){
  ['game','set'].forEach(type=>{
    const minEl=document.getElementById(type+'EditMin');
    const secEl=document.getElementById(type+'EditSec');

    minEl.addEventListener('input',()=>{
      minEl.value=onlyDigits(minEl.value,3);
    });

    secEl.addEventListener('input',()=>{
      secEl.value=onlyDigits(secEl.value,2);
      if(secEl.value!=='' && Number(secEl.value)>59) secEl.value='59';
    });
  });
}

function openClockEdit(type){
  if(!match)return;

  if(type==='game'){
    if(match.game_running)return;
    setSplitClockInputs('game',gameRemaining());
    document.getElementById('gameEditPanel').classList.remove('hidden');
  }else{
    if(match.game_running || match.set_running)return;
    setSplitClockInputs('set',setRemaining());
    document.getElementById('setEditPanel').classList.remove('hidden');
  }
}

function closeClockEdit(type){
  document.getElementById(type==='game'?'gameEditPanel':'setEditPanel').classList.add('hidden');
}

async function applyClockEdit(type){
  if(!match)return;

  if(type==='game'){
    if(match.game_running){
      setStatus('Pause the match before editing the clock.');
      return;
    }
    const sec=readSplitClockInputs('game');
    if(sec===null){
      setStatus('Seconds must be between 00 and 59.');
      return;
    }
    await patch({game_seconds:sec,game_running:false,game_ends_at:null});
    closeClockEdit('game');
    setStatus('Match clock updated.');
  }else{
    if(match.game_running || match.set_running){
      setStatus('Pause the match and set before editing the set clock.');
      return;
    }
    const sec=readSplitClockInputs('set');
    if(sec===null){
      setStatus('Seconds must be between 00 and 59.');
      return;
    }
    await patch({set_seconds:sec,set_running:false,set_ends_at:null});
    closeClockEdit('set');
    setStatus('Set clock updated.');
  }
}

function populateTeamSelects(){
  const selects=[
    {el:document.getElementById('teamA'), selected:match?.team_a_id},
    {el:document.getElementById('teamB'), selected:match?.team_b_id}
  ];

  for(const item of selects){
    const el=item.el;
    const current=String(item.selected??'');
    el.innerHTML='<option value="">SELECT TEAM</option>';

    for(const team of teams){
      const opt=document.createElement('option');
      opt.value=team.id;
      opt.textContent=team.name;
      if(String(team.id)===current) opt.selected=true;
      el.appendChild(opt);
    }
  }
}

async function loadTeams(){
  const {data,error}=await db
    .from('teams')
    .select('id,name,short_name,logo_url')
    .order('name',{ascending:true});

  if(error){
    setStatus('Teams error: '+error.message);
    return;
  }

  teams=data||[];
  populateTeamSelects();
}

async function selectTeam(side,teamId){
  if(!teamId)return;

  const team=teams.find(t=>String(t.id)===String(teamId));
  if(!team)return;

  const fields=side==='a'
    ? {
        team_a_id:team.id,
        team_a_name:(team.short_name||team.name).toUpperCase(),
        team_a_logo:team.logo_url||null
      }
    : {
        team_b_id:team.id,
        team_b_name:(team.short_name||team.name).toUpperCase(),
        team_b_logo:team.logo_url||null
      };

  await patch(fields);
}

function render(){
  if(!match)return;

  const m=mode();
  const firstHalf=Number(match.half_number)!==2;
  const secondHalf=!firstHalf;
  const isHalf=m==='halftime';
  const is90=m==='special90';
  const isGolden=m==='golden';
  const isNormal=m==='normal';

  document.getElementById('backToMatchRow').classList.toggle('hidden',!(is90 || isGolden));

  if(teams.length){
    document.getElementById('teamA').value=match.team_a_id?String(match.team_a_id):'';
    document.getElementById('teamB').value=match.team_b_id?String(match.team_b_id):'';
  }

  const categorySelect=document.getElementById('category');
  if(categorySelect) categorySelect.value=match.category||'MEN';
  document.getElementById('scoreA').textContent=match.score_a??0;
  document.getElementById('scoreB').textContent=match.score_b??0;
  document.getElementById('gameTime').textContent=fmt(gameRemaining());
  document.getElementById('setTime').textContent=fmt(setRemaining());
  document.getElementById('halfTime').textContent=fmt(halftimeRemaining());

  document.getElementById('halfText').textContent=secondHalf?'SECOND HALF':'FIRST HALF';
  document.getElementById('modeText').textContent=
    isHalf?'HALF TIME':is90?'1:30 SET':isGolden?'GOLDEN SET':'NORMAL PLAY';

  document.getElementById('gameBtn').textContent=match.game_running?'PAUSE GAME':'START GAME';
  document.getElementById('gameBtn').className=match.game_running?'danger':'accent';
  document.getElementById('setBtn').textContent=match.set_running?'PAUSE SET':'START SET';

  // Clock editing is only available while paused.
  const canEditGame=!match.game_running && !isHalf;
  const canEditSet=!match.game_running && !match.set_running && !isHalf;
  document.getElementById('editGameBtn').classList.toggle('hidden',!canEditGame);
  document.getElementById('editSetBtn').classList.toggle('hidden',!canEditSet);
  if(!canEditGame) closeClockEdit('game');
  if(!canEditSet) closeClockEdit('set');

  // START GAME exists only in NORMAL PLAY and sits alone on top.
  document.getElementById('gameBtn').classList.toggle('hidden',!isNormal);
  document.getElementById('gamePrimaryRow').classList.toggle('hidden',!isNormal);

  // HALF TIME is available only in FIRST HALF, not during half time or golden set.
  const showHalfTimeButton=firstHalf && !isHalf && !isGolden;
  document.getElementById('halfTimeBtn').classList.toggle('hidden',!showHalfTimeButton);

  // GOLDEN SET is available only in SECOND HALF, not during half time.
  const showGoldenButton=secondHalf && !isHalf;
  document.getElementById('goldenBtn').classList.toggle('hidden',!showGoldenButton);

  // 1:30 SET remains available except during HALF TIME.
  const showSpecial90=!isHalf;
  document.getElementById('special90Btn').classList.toggle('hidden',!showSpecial90);

  // Secondary action row is shown only if at least one secondary action is visible.
  document.getElementById('secondaryPlayRow').classList.toggle(
    'hidden',
    !(showSpecial90 || showHalfTimeButton || showGoldenButton)
  );

  document.getElementById('halfControls').classList.toggle('hidden',!isHalf);
  document.getElementById('halfClockCard').classList.toggle('hidden',!isHalf);
  document.getElementById('gameClockCard').classList.toggle('hidden',isHalf || is90 || isGolden);
  document.getElementById('setClockCard').classList.toggle('hidden',isHalf);

  document.getElementById('setLabel').textContent=is90?'1:30 Set':isGolden?'Golden Set':'Set Clock';
  document.getElementById('setResetBtn').textContent=is90?'RESET 1:30':'RESET 3:00';
  document.getElementById('halfToggleBtn').textContent=
    match.halftime_running?'PAUSE HALF TIME':'RESUME HALF TIME';
}

async function patch(fields){
  if(!matchId)return;
  const {data,error}=await db
    .from('matches')
    .update({...fields,updated_at:new Date().toISOString()})
    .eq('id',matchId)
    .select()
    .single();

  if(error){
    setStatus('Error: '+error.message);
    return;
  }
  match=data;
  render();
  setStatus('Synced');
}

async function loadMatch(){
  const {data,error}=await db
    .from('matches')
    .select('*')
    .eq('court_number',COURT)
    .single();

  if(error){
    setStatus('Read error: '+error.message);
    return;
  }

  match=data;
  matchId=data.id;
  await loadTeams();
  render();
  setStatus(`Connected — Court ${COURT}`);
}

async function changeScore(side,delta){
  const key=side==='a'?'score_a':'score_b';
  await patch({[key]:Math.max(0,Number(match[key]||0)+delta)});
}

async function toggleGame(){
  if(mode()!=='normal')return;

  if(match.game_running){
    await patch({
      game_seconds:gameRemaining(),
      game_running:false,
      game_ends_at:null,
      set_seconds:setRemaining(),
      set_running:false,
      set_ends_at:null
    });
    return;
  }

  const g=gameRemaining();
  const s=setRemaining();

  await patch({
    game_running:g>0,
    game_ends_at:g>0?isoAfter(g):null,
    set_running:s>0,
    set_ends_at:s>0?isoAfter(s):null
  });
}

async function toggleSet(){
  if(mode()==='halftime')return;

  if(match.set_running){
    await patch({
      set_seconds:setRemaining(),
      set_running:false,
      set_ends_at:null
    });
  }else{
    const s=setRemaining();
    await patch({
      set_running:s>0,
      set_ends_at:s>0?isoAfter(s):null
    });
  }
}

async function resetGame(){
  if(mode()!=='normal')return;
  await patch({
    game_seconds:900,
    game_running:false,
    game_ends_at:null
  });
}

async function resetSet(){
  if(mode()==='halftime')return;
  const seconds=mode()==='special90'?90:180;
  await patch({
    set_seconds:seconds,
    set_running:false,
    set_ends_at:null
  });
}


function specialReturnKey(){
  return `isdo-special-return-court-${COURT}`;
}

function saveReturnState(){
  if(!match)return;
  const snapshot={
    game_seconds:gameRemaining(),
    set_seconds:setRemaining(),
    half_number:Number(match.half_number)||1
  };
  sessionStorage.setItem(specialReturnKey(),JSON.stringify(snapshot));
}

async function backToMatch(){
  let snapshot=null;
  try{
    snapshot=JSON.parse(sessionStorage.getItem(specialReturnKey())||'null');
  }catch(e){}

  await patch({
    play_mode:'normal',
    is_halftime:false,
    halftime_running:false,
    halftime_ends_at:null,
    game_seconds:snapshot?.game_seconds ?? Math.max(0,Number(match?.game_seconds||0)),
    game_running:false,
    game_ends_at:null,
    set_seconds:snapshot?.set_seconds ?? 180,
    set_running:false,
    set_ends_at:null
  });

  sessionStorage.removeItem(specialReturnKey());
}

async function activateSpecial90(){
  saveReturnState();
  const preservedGame=gameRemaining();
  await patch({
    play_mode:'special90',
    game_seconds:preservedGame,
    game_running:false,
    game_ends_at:null,
    set_seconds:90,
    set_running:false,
    set_ends_at:null,
    is_halftime:false,
    halftime_running:false,
    halftime_ends_at:null
  });
}

async function activateGoldenSet(){
  if(Number(match.half_number)!==2)return;
  saveReturnState();
  const preservedGame=gameRemaining();
  await patch({
    play_mode:'golden',
    game_seconds:preservedGame,
    game_running:false,
    game_ends_at:null,
    set_seconds:180,
    set_running:false,
    set_ends_at:null,
    is_halftime:false,
    halftime_running:false,
    halftime_ends_at:null
  });
}

async function startHalfTime(){
  if(Number(match.half_number)===2)return;
  if(!confirm('Switch to HALF TIME?'))return;

  await patch({
    play_mode:'halftime',
    is_halftime:true,
    halftime_seconds:180,
    halftime_running:true,
    halftime_ends_at:isoAfter(180),
    game_seconds:gameRemaining(),
    game_running:false,
    game_ends_at:null,
    set_seconds:setRemaining(),
    set_running:false,
    set_ends_at:null
  });
}

async function toggleHalfTimeClock(){
  if(mode()!=='halftime')return;

  if(match.halftime_running){
    await patch({
      halftime_seconds:halftimeRemaining(),
      halftime_running:false,
      halftime_ends_at:null
    });
  }else{
    const h=halftimeRemaining();
    await patch({
      halftime_running:h>0,
      halftime_ends_at:h>0?isoAfter(h):null
    });
  }
}

async function resetHalfTime(){
  if(mode()!=='halftime')return;
  await patch({
    halftime_seconds:180,
    halftime_running:false,
    halftime_ends_at:null
  });
}

async function prepareSecondHalf(){
  if(!confirm('Prepare SECOND HALF?'))return;
  sessionStorage.removeItem(specialReturnKey());

  await patch({
    half_number:2,
    play_mode:'normal',
    is_halftime:false,
    halftime_seconds:180,
    halftime_running:false,
    halftime_ends_at:null,
    game_seconds:900,
    game_running:false,
    game_ends_at:null,
    set_seconds:180,
    set_running:false,
    set_ends_at:null
  });
}

async function resetAll(){
  if(!confirm('Reset scores, clocks and return to FIRST HALF?'))return;
  sessionStorage.removeItem(specialReturnKey());

  await patch({
    score_a:0,
    score_b:0,
    half_number:1,
    play_mode:'normal',
    is_halftime:false,
    halftime_seconds:180,
    halftime_running:false,
    halftime_ends_at:null,
    game_seconds:900,
    game_running:false,
    game_ends_at:null,
    set_seconds:180,
    set_running:false,
    set_ends_at:null
  });
}

document.getElementById('teamA').addEventListener('change',e=>
  selectTeam('a',e.target.value)
);
document.getElementById('teamB').addEventListener('change',e=>
  selectTeam('b',e.target.value)
);

const categorySelect=document.getElementById('category');
if(categorySelect){
  categorySelect.addEventListener('change',e=>
    patch({category:e.target.value})
  );
}

let expirySync=false;

setInterval(()=>{
  if(!match)return;
  render();

  if(expirySync)return;

  const updates={};
  const m=mode();

  if(m==='halftime' && match.halftime_running && halftimeRemaining()<=0){
    updates.halftime_seconds=0;
    updates.halftime_running=false;
    updates.halftime_ends_at=null;
  }

  if(m!=='halftime'){
    if(m==='normal' && match.game_running && gameRemaining()<=0){
      updates.game_seconds=0;
      updates.game_running=false;
      updates.game_ends_at=null;
    }

    if(match.set_running && setRemaining()<=0){
      updates.set_seconds=0;
      updates.set_running=false;
      updates.set_ends_at=null;
    }
  }

  if(Object.keys(updates).length){
    expirySync=true;
    patch(updates).finally(()=>expirySync=false);
  }
},200);

db.channel(`matches-control-court-${COURT}`)
  .on(
    'postgres_changes',
    {event:'UPDATE',schema:'public',table:'matches',filter:`court_number=eq.${COURT}`},
    payload=>{
      if(payload.new && payload.new.court_number===COURT){
        match=payload.new;
        matchId=payload.new.id;
        render();
      }
    }
  )
  .subscribe();

bindClockNumberInputs();
loadMatch();

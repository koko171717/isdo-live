<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISDO Court Scoreboard TV v3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#08111c;
  --panel:#111c28;
  --panel2:#172433;
  --panel3:#1d2a39;
  --cream:#f7f1e8;
  --muted:#aab6c2;
  --red:#c91f39;
  --red2:#ff304f;
  --line:#263646;
  --gold:#e2bb48;
  --half:#f0c95a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--cream);
  font-family:Arial,Helvetica,sans-serif;
}
body{
  display:flex;
  align-items:stretch;
  justify-content:center;
}
.screen{
  width:100vw;
  height:100vh;
  display:grid;
  grid-template-rows:40vh 1fr;
  gap:1.2vh;
  padding:1.6vh 1.8vw;
}

/* TOP 25-30% ZONE */
.top-zone{
  display:grid;
  grid-template-rows:auto 1fr;
  gap:.8vh;
  min-height:0;
}
.meta-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:end;
  gap:1vw;
}
.meta-left{
  display:flex;
  align-items:flex-end;
  gap:.4vw;
  justify-self:start;
}
.event-tab{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:4.3vh;
  padding:0 1.25vw;
  background:var(--red);
  color:#fff;
  font-size:1.8vw;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  border-radius:6px 6px 0 0;
}
.category-tab{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:3.8vh;
  padding:0 1vw;
  background:var(--panel2);
  color:#fff;
  font-size:1.35vw;
  font-weight:900;
  letter-spacing:.10em;
  text-transform:uppercase;
  border-top:4px solid var(--red2);
  border-radius:6px 6px 0 0;
}

.court-tab{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:3.8vh;
  padding:0 1.15vw;
  background:var(--panel2);
  color:#fff;
  font-size:1.35vw;
  font-weight:900;
  letter-spacing:.10em;
  text-transform:uppercase;
  border-top:4px solid var(--red2);
  border-radius:6px 6px 0 0;
  justify-self:center;
}

.phase-chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:16vw;
  height:4.3vh;
  padding:0 1.1vw;
  background:var(--panel2);
  color:#fff;
  border-top:4px solid var(--red2);
  font-size:1.45vw;
  font-weight:900;
  letter-spacing:.10em;
  text-transform:uppercase;
  border-radius:6px 6px 0 0;
  justify-self:end;
}

.score-strip{
  display:grid;
  grid-template-columns:1fr 33vw 1fr;
  min-height:0;
  background:#0d1520;
  border-top:6px solid var(--red2);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(0,0,0,.24);
}

.team{
  display:grid;
  grid-template-columns:7.4vw 1fr;
  align-items:center;
  min-width:0;
  min-height:0;
}
.team.right{
  grid-template-columns:1fr 7.4vw;
  text-align:right;
}
.logo-zone{
  position:relative;
  width:7.4vw;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(135deg,rgba(255,48,79,.24),rgba(255,48,79,.05)),
    #141f2b;
}
.team:not(.right) .logo-zone{
  border-right:1px solid rgba(255,255,255,.08);
}
.team.right .logo-zone{
  border-left:1px solid rgba(255,255,255,.08);
}
.logo-zone::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(13,21,32,0) 58%,rgba(13,21,32,.64) 100%);
  pointer-events:none;
}
.team.right .logo-zone::after{
  background:linear-gradient(270deg,rgba(13,21,32,0) 58%,rgba(13,21,32,.64) 100%);
}
.logo-art{
  position:absolute;
  width:8.6vw;
  height:8.6vw;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-art img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
}
.initial{
  font-size:3vw;
  font-weight:900;
  color:rgba(255,255,255,.88);
}
.team-name-wrap{
  min-width:0;
  padding:0 1.25vw;
}
.name{
  min-width:0;
  font-size:2.45vw;
  line-height:1;
  font-weight:900;
  color:var(--cream);
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.01em;
}

.scorebox{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1.4vw;
  background:#1a2735;
  border-left:1px solid rgba(255,255,255,.08);
  border-right:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 6px 0 rgba(255,48,79,.28);
}
.score{
  color:#fff;
  font-size:10.8vw;
  line-height:1;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  transform:translateY(-0.35vh);
}
.hyphen{
  width:3px;
  height:6.8vw;
  background:rgba(255,255,255,.92);
  border-radius:999px;
  font-size:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.06);
}

/* BOTTOM CHRONO ZONE */
.clock-zone{
  display:grid;
  grid-template-columns:1fr 1.08fr;
  gap:1.1vw;
  min-height:0;
}
.clock-card{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:0;
  box-shadow:0 12px 32px rgba(0,0,0,.22);
  padding:.7vh 0 .3vh;
}
.match-card{
  background:var(--panel);
  border:1px solid var(--line);
}
.set-card{
  background:linear-gradient(180deg,#dc2948,#b91b35);
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
}
.clock-title{
  position:absolute;
  top:5.5%;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  font-weight:900;
  letter-spacing:.11em;
  text-transform:uppercase;
  margin:0;
}
.match-card .clock-title{
  color:var(--muted);
  font-size:2.3vw;
}
.set-card .clock-title{
  color:#fff;
  font-size:2.7vw;
}
.clock-time{
  line-height:.82;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.match-card .clock-time{
  font-size:12.8vw;
}
.set-card .clock-time{
  font-size:16.8vw;
}

/* States */
.halftime .set-card{
  background:linear-gradient(180deg,#f4d56e,#ddb94d);
  color:#231b05;
}
.halftime .set-card .clock-title{
  color:#231b05;
}
.golden .set-card{
  background:linear-gradient(180deg,#ecd27d,#caa33a);
  color:#241b00;
}
.golden .set-card .clock-title{
  color:#241b00;
}

@media (max-width:1100px){
  .screen{grid-template-rows:40vh 1fr}
  .score-strip{grid-template-columns:1fr 35vw 1fr}
  .name{font-size:2.7vw}
  .score{font-size:11.4vw}
  .match-card .clock-time{font-size:13.2vw}
  .set-card .clock-time{font-size:17.2vw}
}
</style>
</head>
<body>
<div class="screen" id="screen">

  <div class="top-zone">
    <div class="meta-row">
      <div class="meta-left">
        <div class="event-tab">ISDO'27</div>
        <div class="category-tab" id="categoryTab">MEN</div>
      </div>
      <div class="court-tab" id="courtTab">COURT 1</div>
      <div class="phase-chip" id="phaseChip">FIRST HALF</div>
    </div>

    <div class="score-strip">
      <div class="team">
        <div class="logo-zone">
          <div class="logo-art">
            <img id="logoA" alt="">
            <div class="initial" id="initialA">A</div>
          </div>
        </div>
        <div class="team-name-wrap">
          <div class="name" id="teamA">TEAM A</div>
        </div>
      </div>

      <div class="scorebox">
        <div class="score" id="scoreA">0</div>
        <div class="hyphen">-</div>
        <div class="score" id="scoreB">0</div>
      </div>

      <div class="team right">
        <div class="team-name-wrap">
          <div class="name" id="teamB">TEAM B</div>
        </div>
        <div class="logo-zone">
          <div class="logo-art">
            <img id="logoB" alt="">
            <div class="initial" id="initialB">B</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="clock-zone">
    <div class="clock-card match-card">
      <div class="clock-title">Match Clock</div>
      <div class="clock-time" id="gameClock">15:00</div>
    </div>

    <div class="clock-card set-card">
      <div class="clock-title" id="setTitle">Set Clock</div>
      <div class="clock-time" id="setClock">03:00</div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL="https://orqvmsttedmtenvrwfzk.supabase.co";
const SUPABASE_KEY="sb_publishable_Nfs8j9E7aiQea5VHC_hD-Q_tHm7nWv3";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(window.location.search);
const COURT=Math.min(4,Math.max(1,Number(params.get('court'))||1));
document.title=`ISDO Court Scoreboard TV — Court ${COURT}`;
document.getElementById('courtTab').textContent=`COURT ${COURT}`;

let match=null;
let matchId=null;

function fmt(sec){
  sec=Math.max(0,Number(sec||0));
  const m=Math.floor(sec/60);
  const s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function remainingSeconds(storedSeconds,running,endsAt){
  if(!running) return Math.max(0,Number(storedSeconds||0));
  if(!endsAt) return Math.max(0,Number(storedSeconds||0));
  return Math.max(0,Math.ceil((new Date(endsAt).getTime()-Date.now())/1000));
}
function gameRemaining(){
  return remainingSeconds(match?.game_seconds,match?.game_running,match?.game_ends_at);
}
function setRemaining(){
  return remainingSeconds(match?.set_seconds,match?.set_running,match?.set_ends_at);
}
function halftimeRemaining(){
  return remainingSeconds(match?.halftime_seconds,match?.halftime_running,match?.halftime_ends_at);
}
function firstLetter(name,fallback){
  const n=(name||'').trim();
  return n ? n[0].toUpperCase() : fallback;
}
function setLogo(imgId,initialId,url,letter){
  const img=document.getElementById(imgId);
  const ini=document.getElementById(initialId);

  if(url && String(url).startsWith('http')){
    img.src=url;
    img.style.display='block';
    ini.style.display='none';
    img.onerror=()=>{
      img.style.display='none';
      ini.style.display='block';
      ini.textContent=letter;
    };
  }else{
    img.style.display='none';
    ini.style.display='block';
    ini.textContent=letter;
  }
}
function render(){
  if(!match) return;

  const screen=document.getElementById('screen');
  screen.classList.remove('halftime','golden');

  const mode=match.play_mode||'normal';
  const halfText=Number(match.half_number)===2?'SECOND HALF':'FIRST HALF';
  const a=(match.team_a_name||'TEAM A').toUpperCase();
  const b=(match.team_b_name||'TEAM B').toUpperCase();

  document.getElementById('teamA').textContent=a;
  document.getElementById('teamB').textContent=b;
  document.getElementById('scoreA').textContent=match.score_a ?? 0;
  document.getElementById('scoreB').textContent=match.score_b ?? 0;
  document.getElementById('categoryTab').textContent=(match.category||'MEN').toUpperCase();

  setLogo('logoA','initialA',match.team_a_logo,firstLetter(a,'A'));
  setLogo('logoB','initialB',match.team_b_logo,firstLetter(b,'B'));

  document.getElementById('gameClock').textContent=fmt(gameRemaining());

  if(mode==='halftime'){
    screen.classList.add('halftime');
    document.getElementById('phaseChip').textContent='HALF TIME';
    document.getElementById('setTitle').textContent='Half Time';
    document.getElementById('setClock').textContent=fmt(halftimeRemaining());
  }else if(mode==='special90'){
    document.getElementById('phaseChip').textContent='1:30 SET';
    document.getElementById('setTitle').textContent='1:30 Set';
    document.getElementById('setClock').textContent=fmt(setRemaining());
  }else if(mode==='golden'){
    screen.classList.add('golden');
    document.getElementById('phaseChip').textContent='GOLDEN SET';
    document.getElementById('setTitle').textContent='Golden Set';
    document.getElementById('setClock').textContent=fmt(setRemaining());
  }else{
    document.getElementById('phaseChip').textContent=halfText;
    document.getElementById('setTitle').textContent='Set Clock';
    document.getElementById('setClock').textContent=fmt(setRemaining());
  }
}
async function loadMatch(){
  const {data,error}=await db
    .from('matches')
    .select('*')
    .eq('court_number',COURT)
    .maybeSingle();

  if(!error && data){
    match=data;
    matchId=data.id;
    render();
  }
}
db.channel(`matches-scoreboard-tv-court-${COURT}`)
  .on(
    'postgres_changes',
    {event:'*',schema:'public',table:'matches',filter:`court_number=eq.${COURT}`},
    payload=>{
      if(payload.new && payload.new.court_number===COURT){
        match=payload.new;
        matchId=payload.new.id;
        render();
      }
    }
  )
  .subscribe();

loadMatch();
setInterval(render,200);
setInterval(loadMatch,5000);
</script>
</body>
</html>
